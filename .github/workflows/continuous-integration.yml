name: Continuous Integration

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:

    runs-on: ubuntu-latest

    strategy:
      matrix:
        operating-system:
          - ubuntu-latest
        php-version:
          - '8.4'
          - '8.5'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP ${{ matrix.php-version }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          coverage: xdebug
          tools: composer:v2
          ini-values: assert.exception=1, zend.assertions=1

      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Run test suite
        run: php -d xdebug.mode=coverage ./vendor/bin/phpunit --coverage-clover=coverage.xml

      - name: Upload coverage report
        uses: codecov/codecov-action@v5
        with:
          fail_ci_if_error: false

  integration:
    name: Integration (MySQL ${{ matrix.mysql }} / Postgres ${{ matrix.postgres }})
    runs-on: ubuntu-latest

    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - mysql: '8.4'
            postgres: '17'
          - mysql: '8.0'
            postgres: '15'

    services:
      mysql:
        image: mysql:${{ matrix.mysql }}
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: aura_sqlquery_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: aura_sqlquery_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd=pg_isready
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_mysql, pdo_pgsql, pdo_sqlite
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Run integration test suite
        env:
          DB_MYSQL_DSN: 'mysql:host=127.0.0.1;port=3306;dbname=aura_sqlquery_test'
          DB_MYSQL_USER: root
          DB_MYSQL_PASS: root
          DB_PGSQL_DSN: 'pgsql:host=127.0.0.1;port=5432;dbname=aura_sqlquery_test'
          DB_PGSQL_USER: postgres
          DB_PGSQL_PASS: postgres
        run: ./vendor/bin/phpunit --testsuite integration

  phpstan:
    name: Static Analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Run PHPStan
        run: composer analyse -- --no-progress

  scrutinizer-coverage:
    name: Scrutinizer Code Coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # ocular's tokenless upload resolves the commit's ancestry from git,
          # so it needs the full history rather than a shallow clone.
          fetch-depth: 0

      - name: Setup PHP with coverage driver
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: pcov
          tools: composer:v2

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Generate clover coverage
        run: ./vendor/bin/phpunit --coverage-clover=coverage.clover

      # ocular.phar bundles Guzzle 3, whose is_resource() cURL-handle checks
      # break on PHP 8 (handles are objects there), failing with "Invalid handle
      # provided". Switch to PHP 7.4 just to run the upload; the clover was
      # already generated above on PHP 8.4.
      - name: Switch to PHP 7.4 for the ocular upload
        uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'
          coverage: none

      - name: Upload coverage to Scrutinizer
        run: |
          # scrutinizer-ci.com is behind Cloudflare, which returns 403 to the
          # default Wget/curl user-agent; send a browser UA so the download is
          # allowed. (no -q, so any failure still reports its reason.)
          wget --user-agent="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36" \
            -O ocular.phar https://scrutinizer-ci.com/ocular.phar
          php ocular.phar code-coverage:upload --format=php-clover coverage.clover
