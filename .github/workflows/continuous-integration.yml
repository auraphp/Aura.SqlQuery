name: Continuous Integration

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:

    runs-on: ubuntu-latest

    strategy:
      matrix:
        operating-system:
          - ubuntu-latest
        php-version:
          - '8.4'
          - '8.5'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP ${{ matrix.php-version }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          coverage: xdebug
          tools: composer:v2
          ini-values: assert.exception=1, zend.assertions=1

      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Run test suite
        run: php -d xdebug.mode=coverage ./vendor/bin/phpunit --coverage-clover=coverage.xml

      - name: Upload coverage report
        uses: codecov/codecov-action@v5
        with:
          fail_ci_if_error: false

  integration:
    name: Integration (MySQL ${{ matrix.mysql }} / Postgres ${{ matrix.postgres }})
    runs-on: ubuntu-latest

    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - mysql: '8.4'
            postgres: '17'
          - mysql: '8.0'
            postgres: '15'

    services:
      mysql:
        image: mysql:${{ matrix.mysql }}
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: aura_sqlquery_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: aura_sqlquery_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd=pg_isready
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_mysql, pdo_pgsql, pdo_sqlite
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Run integration test suite
        env:
          DB_MYSQL_DSN: 'mysql:host=127.0.0.1;port=3306;dbname=aura_sqlquery_test'
          DB_MYSQL_USER: root
          DB_MYSQL_PASS: root
          DB_PGSQL_DSN: 'pgsql:host=127.0.0.1;port=5432;dbname=aura_sqlquery_test'
          DB_PGSQL_USER: postgres
          DB_PGSQL_PASS: postgres
        run: ./vendor/bin/phpunit --testsuite integration

  integration-sqlsrv:
    name: Integration (SQL Server ${{ matrix.mssql }})
    runs-on: ubuntu-latest

    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        mssql: ['2022-latest', '2019-latest']

    services:
      mssql:
        image: mcr.microsoft.com/mssql/server:${{ matrix.mssql }}
        env:
          ACCEPT_EULA: 'Y'
          MSSQL_SA_PASSWORD: 'Aura!Passw0rd'
          SA_PASSWORD: 'Aura!Passw0rd'
        ports:
          - 1433:1433

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlsrv, pdo_sqlite
          coverage: none
          tools: composer:v2

      # setup-php installs the pdo_sqlsrv extension but not the ODBC driver it
      # talks to, and the runner image does not ship one; without this the
      # first connection fails with SQLSTATE[IMSSP]
      - name: Install the Microsoft ODBC driver
        run: |
          # the repo's own package, so that the keyring lands where the
          # generated sources list expects it (/usr/share/keyrings)
          curl -fsSL -O "https://packages.microsoft.com/config/ubuntu/$(lsb_release -rs)/packages-microsoft-prod.deb"
          sudo dpkg -i packages-microsoft-prod.deb
          rm packages-microsoft-prod.deb
          sudo apt-get update
          sudo ACCEPT_EULA=Y apt-get install -y msodbcsql18 unixodbc
          # fail loudly here rather than at the first connection
          odbcinst -q -d | grep -q 'ODBC Driver 18 for SQL Server'

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      # the mssql image ships no health-check command that is stable across
      # versions, so poll the port from PHP instead of using --health-cmd
      - name: Wait for SQL Server and create the database
        env:
          DB_SQLSRV_PASS: 'Aura!Passw0rd'
        run: |
          cat > /tmp/wait-for-sqlsrv.php <<'PHP'
          <?php
          $dsn = 'sqlsrv:Server=127.0.0.1,1433;TrustServerCertificate=1';
          $last = 'no attempt made';
          for ($i = 1; $i <= 90; $i++) {
              try {
                  $pdo = new PDO($dsn, 'sa', getenv('DB_SQLSRV_PASS'));
                  $pdo->setAttribute(PDO::ATTR_ERRMODE, PDO::ERRMODE_EXCEPTION);
                  $pdo->exec("IF DB_ID('aura_sqlquery_test') IS NULL CREATE DATABASE aura_sqlquery_test");
                  echo "SQL Server ready after {$i} attempt(s)\n";
                  exit(0);
              } catch (Exception $e) {
                  $last = $e->getMessage();
                  sleep(2);
              }
          }
          fwrite(STDERR, "SQL Server never became ready: {$last}\n");
          exit(1);
          PHP
          php /tmp/wait-for-sqlsrv.php

      # --fail-on-skipped, so that a missing driver or an unreachable server
      # fails the job instead of quietly skipping every test in it
      - name: Run SQL Server integration tests
        env:
          DB_SQLSRV_DSN: 'sqlsrv:Server=127.0.0.1,1433;Database=aura_sqlquery_test;TrustServerCertificate=1'
          DB_SQLSRV_USER: sa
          DB_SQLSRV_PASS: 'Aura!Passw0rd'
        run: ./vendor/bin/phpunit tests/Integration/SqlsrvIntegrationTest.php --fail-on-skipped

  phpstan:
    name: Static Analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Run PHPStan
        run: composer analyse -- --no-progress

  scrutinizer-coverage:
    name: Scrutinizer Code Coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # ocular's tokenless upload resolves the commit's ancestry from git,
          # so it needs the full history rather than a shallow clone.
          fetch-depth: 0

      - name: Setup PHP with coverage driver
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: pcov
          tools: composer:v2

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Generate clover coverage
        run: ./vendor/bin/phpunit --coverage-clover=coverage.clover

      # ocular.phar bundles Guzzle 3, whose is_resource() cURL-handle checks
      # break on PHP 8 (handles are objects there), failing with "Invalid handle
      # provided". Switch to PHP 7.4 just to run the upload; the clover was
      # already generated above on PHP 8.4.
      - name: Switch to PHP 7.4 for the ocular upload
        uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'
          coverage: none

      - name: Upload coverage to Scrutinizer
        run: |
          # scrutinizer-ci.com is behind Cloudflare, which returns 403 to the
          # default Wget/curl user-agent; send a browser UA so the download is
          # allowed. (no -q, so any failure still reports its reason.)
          wget --user-agent="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36" \
            -O ocular.phar https://scrutinizer-ci.com/ocular.phar
          php ocular.phar code-coverage:upload --format=php-clover coverage.clover
